#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
本地端到端自测：起一个模拟 Discuz 论坛 HTTP 服务，真实运行 discuz_checkin.py。

覆盖场景（每个都必须 PASS，整体才算 PASS）：
  1. JSON API 模式（kxdao 这类自定义插件）：复刻浏览器 silentCheckin
  2. JSON API 已签到识别
  3. K_misign 插件：签到页无表单，通过 GET operation=qiandao 端点签到
  4. DSU 插件：签到页自带表单，通过表单 action 提交签到
  5. 已签到场景（DSU）：应识别“已签到”并返回退出码 0
  6. 密码错误应失败（证明测试有效）

用法：python tests/test_e2e_local.py
"""
import http.server
import os
import re
import socket
import subprocess
import sys
import threading
from pathlib import Path
from urllib.parse import urlparse, parse_qs

ROOT = Path(__file__).resolve().parent.parent
SCRIPT = ROOT / "discuz_checkin.py"

FORMHASH = "TESTFORMHASH123"
USER = "tester"
PWD = "pass1234"

PAGE_TPL = """<html><head><title>{title} - 测试论坛</title></head><body>
{body}</body></html>"""

# 模拟 kxdao 自定义签到插件的首页（含 _api / _fh / 静默签到按钮）
JSON_HOME_BODY = """
<script>
var _api = 'plugin.php?id=kx_checkin:index';
var _fh = '{fh}';
</script>
<a href="member.php?mod=logging&action=logout">退出</a>
<button id="btn-silent">快速静默签到</button>
<div id="sign-msg"></div>
""".format(fh=FORMHASH)


def make_handler(state):
    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):  # 静默访问日志
            pass

        def _logged_in(self):
            return "session=ok" in (self.headers.get("Cookie") or "")

        def _send(self, body, cookie=None, code=200, ctype="text/html; charset=utf-8"):
            data = body.encode("utf-8") if isinstance(body, str) else body
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            if cookie:
                self.send_header("Set-Cookie", cookie)
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            u = urlparse(self.path)
            q = parse_qs(u.query)
            path = u.path

            if path == "/member.php" and q.get("action") == ["login"]:
                body = PAGE_TPL.format(
                    title="登录",
                    body=(
                        '<form method="post" action="member.php?mod=logging&'
                        'action=login&loginsubmit=yes&loginhash=Ab1&inajax=1">'
                        f'<input type="hidden" name="formhash" value="{FORMHASH}"/>'
                        '<input type="text" name="username"/>'
                        '<input type="password" name="password"/>'
                        '<input type="submit" name="loginsubmit" value="登录"/>'
                        "</form>"
                    ),
                )
                return self._send(body)

            if path == "/":
                if self._logged_in() and state.get("json_mode"):
                    return self._send(PAGE_TPL.format(title="首页", body=JSON_HOME_BODY))
                if self._logged_in():
                    body = PAGE_TPL.format(
                        title="首页",
                        body=(
                            '<a href="member.php?mod=logging&amp;action=logout">退出</a>'
                            f'<a href="plugin.php?id={state["plugin"]}">签到</a>'
                        ),
                    )
                else:
                    body = PAGE_TPL.format(
                        title="首页",
                        body='<a href="member.php?mod=logging&amp;action=login">登录</a>',
                    )
                return self._send(body)

            if path == "/plugin.php":
                pid = q.get("id", [""])[0]
                if pid != state["plugin"]:
                    return self._send("插件不存在或已关闭", code=404)

                if state["signed"]:
                    return self._send(
                        PAGE_TPL.format(title="签到", body="<div>您今天已经签到啦</div>")
                    )

                op = q.get("operation", [""])[0]
                if op == "qiandao" and not self._logged_in():
                    return self._send("请先登录后再签到")
                if op == "qiandao":
                    if q.get("formhash", [""])[0] != FORMHASH:
                        return self._send("非法请求：formhash 错误")
                    state["signed"] = True
                    return self._send("签到成功，恭喜您获得 10 金币")

                # 签到页（K_misign：无表单；DSU：自带表单）
                if state["plugin"] == "k_misign:sign":
                    body = PAGE_TPL.format(
                        title="每日签到",
                        body=(
                            f'<input type="hidden" name="formhash" value="{FORMHASH}"/>'
                            '<a id="JD_sign" href="javascript:;">我要签到</a>'
                        ),
                    )
                    return self._send(body)
                body = PAGE_TPL.format(
                    title="每日签到",
                    body=(
                        '<form method="post" action="plugin.php?id=dsu_paulsign:sign'
                        '&operation=qiandao&infloat=yes&inajax=1">'
                        f'<input type="hidden" name="formhash" value="{FORMHASH}"/>'
                        '<select name="qdxq"><option value="kua">开心</option></select>'
                        '<input type="text" name="todaysay"/>'
                        "</form>"
                    ),
                )
                return self._send(body)

            return self._send("not found", code=404)

        def do_POST(self):
            u = urlparse(self.path)
            q = parse_qs(u.query)
            path = u.path
            length = int(self.headers.get("Content-Length") or 0)
            raw = self.rfile.read(length).decode("utf-8")
            fields = dict(kv.split("=", 1) for kv in raw.split("&") if "=" in kv)

            # 登录提交
            if path == "/member.php" and q.get("mod") == ["logging"] and \
                    q.get("action") == ["login"]:
                if fields.get("username") == USER and fields.get("password") == PWD:
                    return self._send("欢迎您回来", cookie="session=ok")
                return self._send("登录失败，密码错误")

            # JSON API 签到端点：plugin.php?id=kx_checkin:index&action=checkin
            if path == "/plugin.php" and q.get("action") == ["checkin"]:
                if not self._logged_in():
                    body = '{"code":1,"error":"请先登录"}'.encode("utf-8")
                    return self._send(body, ctype="application/json")
                if fields.get("formhash") != FORMHASH:
                    body = '{"code":1,"error":"formhash 错误"}'.encode("utf-8")
                    return self._send(body, ctype="application/json")
                if state["signed"]:
                    body = '{"code":1,"error":"您今天已经签到"}'.encode("utf-8")
                    return self._send(body, ctype="application/json")
                state["signed"] = True
                payload = (
                    '{"code":0,"data":{"streak":5,"credits_got":10,'
                    '"today_rank":3,"milestone":"连续签到 5 天达成"}}'
                )
                return self._send(payload.encode("utf-8"), ctype="application/json")

            # 旧插件 POST 端点
            if path == "/plugin.php" and q.get("operation") == ["qiandao"]:
                if not self._logged_in():
                    return self._send("请先登录后再签到")
                if fields.get("formhash") != FORMHASH:
                    return self._send("非法请求：formhash 错误")
                state["signed"] = True
                return self._send("签到成功，恭喜您获得 10 金币")

            return self._send("not found", code=404)

    return Handler


def free_port():
    s = socket.socket()
    s.bind(("127.0.0.1", 0))
    port = s.getsockname()[1]
    s.close()
    return port


def run_server(state):
    port = free_port()
    server = http.server.ThreadingHTTPServer(
        ("127.0.0.1", port), make_handler(state)
    )
    threading.Thread(target=server.serve_forever, daemon=True).start()
    return server, port


def run_script(port, extra_env=None):
    env = os.environ.copy()
    env.update(
        {
            "FORUM_URL": f"http://127.0.0.1:{port}",
            "DZ_USERNAME": USER,
            "DZ_PASSWORD": PWD,
            "DZ_DEBUG": "1",
        }
    )
    env.update(extra_env or {})
    return subprocess.run(
        [sys.executable, str(SCRIPT)],
        capture_output=True,
        text=True,
        env=env,
        timeout=60,
    )


def check(name, cond, detail=""):
    mark = "PASS" if cond else "FAIL"
    print(f"  [{mark}] {name}" + (f" — {detail}" if detail and not cond else ""))
    return cond


def scenario_json_api(already=False):
    label = "已签到" if already else "成功"
    print(f"场景 1/2：JSON API 模式（{label}）")
    state = {"plugin": "kx_checkin:index", "signed": already, "json_mode": True}
    server, port = run_server(state)
    try:
        r = run_script(port)
        ok = True
        ok &= check("退出码为 0", r.returncode == 0, r.stdout + r.stderr)
        ok &= check("日志包含 登录成功", "登录成功" in r.stdout)
        if already:
            ok &= check("日志包含 今日已签到", "今日已签到" in r.stdout)
        else:
            ok &= check("日志包含 签到成功", "签到成功" in r.stdout)
            ok &= check("解析到连续签到天数", "连续 5 天" in r.stdout)
        return ok
    finally:
        server.shutdown()


def scenario_k_misign():
    print("场景 3：K_misign 插件（GET 端点签到）")
    state = {"plugin": "k_misign:sign", "signed": False, "json_mode": False}
    server, port = run_server(state)
    try:
        r = run_script(port)
        ok = True
        ok &= check("退出码为 0", r.returncode == 0, r.stdout + r.stderr)
        ok &= check("日志包含 签到成功", "签到成功" in r.stdout)
        return ok
    finally:
        server.shutdown()


def scenario_dsu():
    print("场景 4：DSU 插件（表单提交签到）")
    state = {"plugin": "dsu_paulsign:sign", "signed": False, "json_mode": False}
    server, port = run_server(state)
    try:
        r = run_script(port)
        ok = True
        ok &= check("退出码为 0", r.returncode == 0, r.stdout + r.stderr)
        ok &= check("日志包含 签到成功", "签到成功" in r.stdout)
        return ok
    finally:
        server.shutdown()


def scenario_already_dsu():
    print("场景 5：DSU 已签到识别")
    state = {"plugin": "dsu_paulsign:sign", "signed": True, "json_mode": False}
    server, port = run_server(state)
    try:
        r = run_script(port)
        ok = True
        ok &= check("退出码为 0", r.returncode == 0, r.stdout + r.stderr)
        ok &= check("日志包含 今日已签到", "今日已签到" in r.stdout)
        return ok
    finally:
        server.shutdown()


def scenario_wrong_password():
    print("场景 6：密码错误应失败（证明测试有效）")
    state = {"plugin": "dsu_paulsign:sign", "signed": False, "json_mode": False}
    server, port = run_server(state)
    try:
        r = run_script(port, {"DZ_PASSWORD": "wrongpass"})
        ok = True
        ok &= check("退出码非 0", r.returncode != 0)
        ok &= check("日志包含 登录失败", "登录失败" in r.stdout)
        return ok
    finally:
        server.shutdown()


if __name__ == "__main__":
    os.chdir(ROOT)
    all_ok = True
    for fn in (
        scenario_json_api,          # 默认成功
        lambda: scenario_json_api(already=True),
        scenario_k_misign,
        scenario_dsu,
        scenario_already_dsu,
        scenario_wrong_password,
    ):
        all_ok &= fn()
    print("\n" + ("ALL_E2E_TESTS_PASSED" if all_ok else "SOME_TESTS_FAILED"))
    sys.exit(0 if all_ok else 1)
